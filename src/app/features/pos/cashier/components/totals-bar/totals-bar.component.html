<div class="totals-bar-container">

  <div class="totals-row">
    <div class="total-item label-only">
      <span class="label">إجمالي الفاتورة</span>
    </div>

    <div class="total-item">
      <span class="label">عدد الأصناف:</span>
      <span class="value">{{ distinctItemsCount }}</span>
    </div>

    <div class="total-item">
      <span class="label">الكمية:</span>
      <span class="value">{{ totalQuantity }}</span>
    </div>

    <div class="total-item amount-due">
      <span class="label">المبلغ المطلوب:</span>
      <span class="value">
        <span class="amount">{{ finalTotal | number:'1.2-2' }}</span>
        <span class="currency">جنية</span>
      </span>
    </div>
  </div>

</div>

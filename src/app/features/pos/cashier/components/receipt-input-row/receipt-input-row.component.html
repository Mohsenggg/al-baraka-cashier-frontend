<form [formGroup]="inputForm" (ngSubmit)="submit()" class="input-row pos-card">

      <!-- Empty cell for # column -->
      <div class="input-cell num-placeholder"></div>

      <!-- Code Search Column -->
      <div class="input-cell code-cell">
            <div class="search-wrapper">
                  <input #searchInput type="text" formControlName="barcode" class="pos-input text-center"
                        placeholder="كود الصنف..." autofocus>
                  <span class="search-icon">🔍</span>
            </div>
      </div>

      <!-- Name Display Column -->
      <div class="input-cell name-cell">
            <input type="text" class="pos-input text-center" placeholder="اسم الصنف" readonly>
      </div>

      <!-- Price Column -->
      <div class="input-cell price-cell">
            <input type="number" formControlName="price" class="pos-input text-center no-spinner" readonly>
      </div>

      <!-- Quantity Column -->
      <div class="input-cell qty-cell">
            <div class="qty-stepper">
                  <button type="button" class="stepper-btn" (click)="decrementQty()">-</button>
                  <input type="number" formControlName="quantity" class="pos-input text-center no-spinner">
                  <button type="button" class="stepper-btn" (click)="incrementQty()">+</button>
            </div>
      </div>

      <!-- Total Column -->
      <div class="input-cell total-cell">
            <div class="readonly-value">0.00</div>
      </div>

      <!-- Empty cell for Balance column -->
      <div class="input-cell balance-placeholder"></div>

      <!-- Actions Column (Add button) -->
      <div class="input-actions">
            <button type="submit" class="pos-btn pos-btn-primary" [disabled]="!inputForm.valid">
                  <span class="submit-text">إضافة</span>
            </button>
      </div>

</form>

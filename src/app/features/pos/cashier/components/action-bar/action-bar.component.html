<div class="action-bar-container pos-card">
  
  <!-- Right side (First in RTL): History Toggle -->
  <div class="history-toggle">
    <button class="history-btn" (click)="toggleRightSidebar.emit()">
      <span class="icon">📜</span>
      <span class="text">الفواتير</span>
    </button>
  </div>

  <!-- Middle: Actions -->
  <div class="actions-group">
    <div class="buttons-container">
      <button class="action-btn primary-solid" (click)="print.emit()">
        <span class="icon">🖨️</span>
        <span class="text">طباعة</span>
        <span class="shortcut">F9</span>
      </button>

      <button class="action-btn outline" (click)="save.emit()">
        <span class="icon">💾</span>
        <span class="text">حفظ</span>
        <span class="shortcut">F2</span>
      </button>

      <button class="action-btn outline" (click)="new.emit()">
        <span class="icon">➕</span>
        <span class="text">جديد</span>
        <span class="shortcut">F3</span>
      </button>

      <button class="action-btn outline" (click)="edit.emit()">
        <span class="icon">✏️</span>
        <span class="text">تعديل</span>
        <span class="shortcut">F4</span>
      </button>

      <button class="action-btn danger-light" (click)="delete.emit()">
        <span class="icon">🗑️</span>
        <span class="text">حذف</span>
        <span class="shortcut">F5</span>
      </button>
    </div>
  </div>

  <!-- Left side (Last in RTL): Navigation Toggle -->
  <div class="menu-toggle">
    <button class="pos-btn-icon-only menu-btn" (click)="toggleSidebar.emit()">
      <span class="icon">☰</span>
    </button>
  </div>

</div>

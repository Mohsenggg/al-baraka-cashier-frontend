<div class="table-container pos-card">
  <div class="table-header">
    <div class="th-cell num-col">#</div>
    <div class="th-cell code-col">كود الصنف</div>
    <div class="th-cell name-col">اسم الصنف</div>
    <div class="th-cell price-col">السعر</div>
    <div class="th-cell qty-col">الكمية</div>
    <div class="th-cell total-col">الإجمالي</div>
    <div class="th-cell balance-col">الرصيد المتبقي</div>
    <div class="th-cell actions-col">الإجراءات</div>
  </div>

  <div class="table-body">
    <div class="table-row" *ngFor="let item of items; let i = index">
      <div class="td-cell num-col">{{ i + 1 }}</div>
      <div class="td-cell code-col">{{ item.product?.barcode || '-' }}</div>
      <div class="td-cell name-col">{{ item.productName }}</div>
      <div class="td-cell price-col">{{ item.price | number:'1.2-2' }}</div>
      
      <div class="td-cell qty-col">
        <div class="qty-stepper">
          <button class="stepper-btn" (click)="updateQuantity.emit({item: item, delta: -1})">-</button>
          <div class="qty-value">{{ item.quantity }}</div>
          <button class="stepper-btn" (click)="updateQuantity.emit({item: item, delta: 1})">+</button>
        </div>
      </div>

      <div class="td-cell total-col fw-bold">{{ item.total | number:'1.2-2' }}</div>
      <div class="td-cell balance-col">{{ item.remainingStock || 0 }}</div>
      
      <div class="td-cell actions-col">
        <button class="pos-btn-icon-only danger" (click)="removeItem.emit(item.productId)">🗑️</button>
        <button class="pos-btn-icon-only" (click)="viewItem.emit(item)">👁️</button>
      </div>
    </div>
    
    <div class="empty-state" *ngIf="items.length === 0">
      <p>لا توجد أصناف في الفاتورة الحالية</p>
    </div>
  </div>
</div>
